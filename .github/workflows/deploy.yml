name: Deploy SmartMedicine

on:
  push:
    branches: [ main ]

jobs:
  deploy-netlify:
    name: Deploy Frontend to Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        run: |
          curl -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}" || echo "Netlify hook not configured"

  notify-render:
    name: Trigger Render Backend Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" || echo "Render hook not configured"
